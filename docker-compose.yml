services:
  db:
    image: postgres:15-alpine
    container_name: arkad_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arkad_db
      POSTGRES_USER: arkad_user
      POSTGRES_PASSWORD: arkad_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkad_user -d arkad_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate-and-seed:
    build: .
    container_name: arkad_migrator
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://arkad_user:arkad_password@db:5432/arkad_db
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    command: >
      sh -c "
        echo 'Generating Prisma client...' &&
        npx prisma generate &&
        echo 'Running database migrations...' &&
        npx prisma migrate deploy &&
        echo 'Database migrations completed' &&
        echo 'Running database seeding...' &&
        node dist/seed.js &&
        echo 'Database seeding completed'
      "
    restart: "no"

  gotenberg:
    image: gotenberg/gotenberg:8-chromium
    container_name: arkad_gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"

  app:
    build: .
    container_name: arkad_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate-and-seed:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://arkad_user:arkad_password@db:5432/arkad_db
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

volumes:
  postgres_data: