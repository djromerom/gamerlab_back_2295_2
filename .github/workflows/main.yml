name: Deploy_back

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Install dependencies
      run: npm install

       
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /home/proyecto/Arkad-Api
          git pull origin main
          git status
          docker stop arkad-api
          docker rm arkad-api
          docker build --build-arg DATABASE_URL=${{ secrets.DATABASE_URL_PROD }} --build-arg DIRECT_URL=${{ secrets.DIRECT_URL_PROD }}  -f Dockerfile -t arkad-api-image . || { echo "Docker build failed"; exit 1; }
          docker run -d \
          -p 5036:3000 \
          -e DATABASE_URL=${{ secrets.DATABASE_URL_PROD }} \
          -e DIRECT_URL=${{ secrets.DIRECT_URL_PROD }} \
          -e SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }} \
          -e SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET_PROD }} \
          -e SUPABASE_KEY=${{ secrets.SUPABASE_KEY_PROD }} \
          -e REGISTRATION_REDIRECT_URL=${{ secrets.REGISTRATION_REDIRECT_URL }} \
          -e RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }} \
          -e EMAIL_PUBLIC_API_KEY=${{ secrets.EMAIL_PUBLIC_API_KEY }} \
          -e EMAIL_PRIVATE_API_KEY=${{ secrets.EMAIL_PRIVATE_API_KEY }} \
          -e EMAIL_SERVICE_ID=${{ secrets.EMAIL_SERVICE_ID }} \
          -e EMAIL_CONFIRMATION_TEMPLATE=${{ secrets.EMAIL_CONFIRMATION_TEMPLATE }} \
          -e FRONTEND_URL=${{ secrets.FRONTEND_URL_PROD }} \
          --name arkad-api \
          arkad-api-image
          docker ps || echo "No running containers"
