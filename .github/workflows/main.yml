name: back-test
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run simple script (here its going to be the testing code)
        run: |
          echo "simple code check"

  docker-image:
    runs-on: ubuntu-latest
    needs: test  
    if: github.ref == 'refs/heads/dev' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Git Pull
        run: git pull

      - name: Read and bump version
        id: versioning
        run: |
          VERSION_FILE=version.txt
          if [ ! -f "$VERSION_FILE" ]; then
            echo 0 > $VERSION_FILE
          fi
          VERSION=$(cat $VERSION_FILE)
          echo "Current version: v$VERSION"
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo $((VERSION + 1)) > $VERSION_FILE
          
      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v5.2.0
        with:
            commit_message: Update version.txt
            branch: dev
            commit_user_name: CamiloDlRM [GITHUB-ACTIONS]
            commit_user_email: zinbak78@gmail.com
            commit_author: CamiloDlRM <zinbak78@gmail.com>

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t arkadapi-test-image .

      - name: Tag Docker image
        run: |
          docker tag arkadapi-test-image ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:arkadapi-test-${{ steps.versioning.outputs.version }}

      - name: Push Docker image
        run: | 
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:arkadapi-test-${{ steps.versioning.outputs.version }}
