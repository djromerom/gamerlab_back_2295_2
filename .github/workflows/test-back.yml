name: Test-back
on:
  # Trigger the workflow on pull requests to dev and main branches
  pull_request:
    branches: [ dev , main ]

jobs:
  # Job to build and unit-test the application
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm run test:ci
        continue-on-error: true
