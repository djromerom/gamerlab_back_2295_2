name: Test-back
on:
  # Trigger the workflow on pull requests to dev and main branches
  pull_request:
    branches: [ dev , main ]

jobs:
  # Job to build and unit-test the application
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies and run tests
        run: \
          npm ci && \
          npx prisma generate && \
          npm run test:ci
