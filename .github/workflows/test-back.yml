name: Test-back
on:
  # Trigger the workflow on pull requests to dev and main branches
  pull_request:
    branches: [ dev , main ]

jobs:
  # Job to build and unit-test the application
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Variables de entorno ordenadas (ARK-43): lo usado en el codigo esta documentado en .env.example,
      # cada variable explica que es / como obtenerla / como rotarla, y no hay .env, cookies.txt, llaves, etc. versionados.
      # TODO: arrancó como aviso; quitar continue-on-error (y marcarlo como check requerido) cuando pase limpio un sprint.
      - name: Check environment variables docs
        run: |
          npm run check:env:test
          npm run check:env
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      # TODO: la deuda actual de lint (~1000 errores sin contar prettier) impide hacerlo bloqueante;
      # quitar continue-on-error cuando se limpie.
      - name: Lint
        run: npx eslint src
        continue-on-error: true

      - name: Run tests
        run: npm run test:ci

  # Job to run the integration tests against a disposable PostgreSQL
  # (test/*.e2e-spec.ts and src/**/*.db.spec.ts skip themselves without a database)
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: arkad
          POSTGRES_PASSWORD: arkad
          POSTGRES_DB: arkad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only lives during this job; not a secret
      DATABASE_URL: postgresql://arkad:arkad@localhost:5432/arkad_ci
      INTEGRATION_DATABASE_URL: postgresql://arkad:arkad@localhost:5432/arkad_ci
      RUN_DB_TESTS: '1'
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      # Both suites share this database: they run one file at a time (maxWorkers 1 in
      # test/jest-e2e.json, --runInBand in the test:db script), also when run locally
      - name: Run integration tests
        run: npm run test:e2e

      - name: Run database unit tests
        run: npm run test:db
