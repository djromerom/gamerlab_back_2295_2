name: Test-back
on:
  # Trigger the workflow on pull requests to dev and main branches
  pull_request:
    branches: [ dev , main ]

jobs:
  # Job to build and unit-test the application
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      # TODO: la deuda actual de lint (~1000 errores sin contar prettier) impide hacerlo bloqueante;
      # quitar continue-on-error cuando se limpie.
      - name: Lint
        run: npx eslint src
        continue-on-error: true

      - name: Run tests
        run: npm run test:ci
